name: Build PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render main.pdf
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2026
          latexmk_use_lualatex: true

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v7
        with:
          name: fair-comic-pdf
          path: main.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
